# Defaults for add-skill.sh and update-skill.sh.
# Sourced as shell at script start. Edit values here, not in the scripts.

# Auto-commit after add/update? (true/false)
AUTO_COMMIT=true

# Auto-push after auto-commit? (only takes effect if AUTO_COMMIT=true)
AUTO_PUSH=true

# Show `git diff --stat` after update?
SHOW_DIFF=true

# Confirm before overwriting an existing skill on update?
CONFIRM_OVERWRITE=true

# Vault directory. Empty = auto-detect from the script's own location.
VAULT_DIR=""
